name: boardhop_relay
description: Boardhop push relay — HTTPS receiver for Azure DevOps service hooks.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0

# Exact versions: the container build must be reproducible.
dependencies:
  shelf: 1.4.2
  shelf_router: 1.1.4
  sqlite3: 2.9.0
  crypto: 3.0.6
  logging: 1.3.0
  # HTTP/2 for APNs: Dart's own HttpClient speaks 1.1 only, and api.push.apple.com
  # accepts nothing but h2. BSD-3, maintained by the Dart team.
  http2: 2.3.1
  # ES256 JWT for the APNs authentication key (.p8). MIT, pure Dart.
  dart_jsonwebtoken: 3.4.1
  # Service-account OAuth2 for FCM HTTP v1, with refresh before expiry. BSD-3,
  # maintained by the Dart team.
  googleapis_auth: 2.3.3
  # The HTTP client googleapis_auth hands back; also the FCM POST. BSD-3.
  http: 1.6.0

dev_dependencies:
  lints: 6.0.0
  test: 1.26.2
