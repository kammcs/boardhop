# Runs as /srv/relay/compose.yml on boardhop-relay-1; deploy.sh puts it there.
# `docker compose` reads /srv/relay/.env for the interpolations below.

x-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2
    container_name: relay-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # SITE_DOMAIN names the marketing site's host in the Caddyfile. It is set
    # by website/deploy.sh; unset, the Caddyfile falls back to a .localhost
    # name that never touches Let's Encrypt.
    # Never interpolate to an empty string here: Caddy's {$VAR:default} only
    # falls back when the variable is *unset*, and a set-but-empty one would
    # leave the site block with no address at all.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-boardhop-site.localhost}
      SITE_ALIAS: ${SITE_ALIAS:-boardhop-site-www.localhost}
    volumes:
      - /srv/relay/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/relay/caddy/data:/data
      - /srv/relay/caddy/config:/config
      # The marketing site's static files. Under /srv/relay because the deploy
      # user owns that tree and needs no sudo to replace them. Read-only:
      # Caddy serves them and has no business writing there.
      - /srv/relay/site:/srv/site:ro
      # Caddyfile fragments written by website/deploy.sh (the site's optional
      # basic auth). A directory, not a file, so the deploy can replace it.
      - /srv/relay/caddy/site-extra:/etc/caddy/site-extra:ro
    depends_on:
      - relay
    # The admin API is container-local; a 200 from it means the config loaded.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *json-logging

  relay:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: boardhop-relay:${RELAY_VERSION:-dev}
    container_name: relay-app
    restart: unless-stopped
    # No host ports: only Caddy reaches it, over the compose network.
    expose:
      - "8080"
    # The deploy user owns /srv/relay/data, so the container writes as it.
    user: "1000:1000"
    env_file:
      - /srv/relay/relay.env
    environment:
      RELAY_DB: /data/relay.sqlite
      RELAY_CAPTURE_DIR: /data/capture
      RELAY_VERSION: ${RELAY_VERSION:-dev}
    volumes:
      - /srv/relay/data:/data
      - /srv/relay/secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *json-logging
